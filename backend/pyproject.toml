[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-insight-backend"
version = "0.1.0"
description = "ATLAS Insight — backend FastAPI SCAP.paris"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "starlette>=0.41,<1.0",
    "uvicorn[standard]==0.34.3",
    "sqlalchemy>=2.0.41",
    "alembic>=1.18",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "ruff==0.11.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
